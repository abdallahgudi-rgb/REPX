<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>REPX Producto</title>
<meta name="theme-color" content="#0f0f11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="REPX">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="icon" href="img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,800;1,800;1,900&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
  .pp { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 48px; padding-block: 28px 80px; align-items: start; }
  @media (max-width: 860px) { .pp { grid-template-columns: minmax(0, 1fr); gap: 24px; padding-top: 0; } }
  .back { display: inline-flex; gap: 8px; align-items: center; color: var(--dust); text-decoration: none; font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; padding-block: 16px; }
  /* galería */
  .gal { position: sticky; top: calc(70px + env(safe-area-inset-top, 0px)); display: grid; gap: 10px; min-width: 0; }
  @media (max-width: 860px) { .gal { position: relative; top: 0; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); } }
  .slides { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; background: var(--iron); aspect-ratio: 4/5; max-width: 100%; }
  .slides::-webkit-scrollbar { display: none; }
  .slides img { flex: 0 0 100%; width: 100%; height: 100%; object-fit: cover; scroll-snap-align: center; }
  .gal-nav { position: absolute; top: 50%; width: 44px; height: 44px; margin-top: -22px; border-radius: 50%; border: 0; background: rgb(15 15 17 / .75); color: var(--bone); font-size: 20px; z-index: 2; }
  .gal-nav.prev { left: 12px; } .gal-nav.next { right: 12px; }
  .gal-count { position: absolute; right: 12px; top: 12px; background: var(--ink); padding: 4px 8px; font-family: var(--mono); font-size: 11px; letter-spacing: .1em; z-index: 2; }
  .thumbs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  .thumbs button { flex: none; width: 70px; aspect-ratio: 4/5; padding: 0; border: 2px solid transparent; background: var(--iron); opacity: .55; }
  .thumbs button[aria-current="true"] { border-color: var(--bone); opacity: 1; }
  .thumbs img { width: 100%; height: 100%; object-fit: cover; }
  @media (max-width: 860px) { .thumbs { padding-inline: max(16px, env(safe-area-inset-left, 0px)); } .gal-nav { display: none; } }
  .dots { display: none; justify-content: center; gap: 6px; }
  /* info */
  .info { display: grid; gap: 22px; min-width: 0; }
  .info h1 { font-family: var(--display); font-style: italic; font-weight: 900; text-transform: uppercase; font-size: clamp(46px, 6vw, 80px); line-height: .88; margin: 0; text-wrap: balance; }
  .info .big-price { font-family: var(--display); font-weight: 800; font-size: 34px; }
  .info .desc { color: var(--dust); font-size: 16px; margin: 0; max-width: 52ch; white-space: pre-line; }
  .stock-note { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; color: var(--dust); min-height: 1.4em; margin: 0; }
  .stock-note.low { color: var(--warn); }
  .qty-big { display: inline-flex; align-items: center; gap: 4px; }
  .qty-big button { width: 46px; height: 46px; background: var(--iron); border: 2px solid var(--line); border-radius: 6px; font-size: 22px; }
  .qty-big span { min-width: 54px; text-align: center; font-family: var(--display); font-weight: 800; font-size: 26px; border-block: 3px solid var(--line); line-height: 28px; }
  .buy { display: grid; gap: 22px; }
  .facts { border-top: 1px solid var(--line); display: grid; }
  .facts div { display: grid; grid-template-columns: 110px 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .facts span:first-child { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--dust); padding-top: 2px; }
  .nf { text-align: center; padding: 80px 0; display: grid; gap: 16px; justify-items: center; }
  .nf img { width: 100px; opacity: .5; }
  .skel { background: var(--iron); animation: pulse 1.4s ease-in-out infinite; }
</style>
</head>
<body class="store">
<header class="top">
  <div class="wrap">
    <a class="logo" href="./" aria-label="REPX inicio"><img src="img/logo-repx.png" alt="REPX"></a>
    <nav class="links" aria-label="Secciones">
      <a href="./#tienda">Tienda</a>
      <a href="./#comprar">Cómo comprar</a>
    </nav>
    <a class="cart-btn" href="./#carrito" style="text-decoration:none"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="9" width="18" height="11" rx="2"/><path d="M8 9V6.5A1.5 1.5 0 0 1 9.5 5h5A1.5 1.5 0 0 1 16 6.5V9"/></svg>Carrito <b id="cartCount">0</b></a>
  </div>
</header>

<main class="wrap">
  <a class="back" href="./#tienda">← Volver a la tienda</a>
  <div id="pp" class="pp">
    <div class="gal"><div class="slides skel"></div></div>
    <div class="info"><div class="skel" style="height:80px"></div><div class="skel" style="height:40px;width:40%"></div></div>
  </div>
</main>

<footer>
  <div class="wrap">
    <img src="img/r-mark.png" alt="REPX">
    <span class="label">REPX · Relentless · Venezuela</span>
  </div>
</footer>

<nav class="tabbar" aria-label="Navegación de la app">
  <a href="./"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</a>
  <a href="./#tienda" class="on"><svg viewBox="0 0 24 24"><path d="M8 3l-5 3 2 5 2-1v11h10V10l2 1 2-5-5-3c0 2-2 3-4 3S8 5 8 3z"/></svg>Tienda</a>
  <a href="./#carrito"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 13H6z M9 8V6a3 3 0 0 1 6 0v2"/></svg>Carrito<span class="badge" id="tabCount" hidden>0</span></a>
  <a href="./#app"><svg viewBox="0 0 24 24"><path d="M12 3v12m-5-5l5 5 5-5M5 21h14"/></svg>App</a>
</nav>

<div class="toast" id="toast" hidden></div>
<script type="module" src="producto.js"></script>
</body>
</html>
